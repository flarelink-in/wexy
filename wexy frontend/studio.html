<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wexy Studio</title>
    <meta name="description" content="Describe a world, fly through it live and save it as a video for YouTube, Reels or TikTok, made on your own computer.">
    <meta name="theme-color" content="#060606">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="studio-page">
    <header class="topbar">
        <a class="brand" href="./" aria-label="Wexy home"><span id="brand-logo"><svg class="wordmark" width="94" height="22" viewBox="331 290 938 220" aria-hidden="true"><image href="/icon_full.svg" width="1600" height="800"/></svg></span><span class="brand-sub">Studio</span></a>
        <div class="doc">
            <span class="doc-title" id="scene-title">Untitled world</span>
        </div>
        <div class="topbar-actions">
            <span class="gpu-pill dev-only" id="gpu-pill"><i></i><span>Starting WebGPU…</span></span>
            <button type="button" class="btn btn-quiet" id="btn-snapshot" disabled title="Save a photo of this moment (P)">Photo</button>
            <button type="button" class="btn btn-primary" id="btn-export" disabled title="Make a video (R)">Make video</button>
        </div>
    </header>

    <main class="workspace">
        <aside class="panel panel-left" id="left" aria-label="Idea and progress"></aside>

        <section class="stage" aria-label="Viewport">
            <div class="viewport" id="viewport">
                <canvas id="gpu-canvas" aria-label="Live 3D world"></canvas>
                <div class="film-gate" id="film-gate" hidden><div class="film-gate-frame" id="film-gate-frame"><span id="film-gate-label">Wide 16:9</span></div></div>
                <div class="hud" id="hud" hidden>
                    <div class="hud-tl"><span class="live-dot"></span><span id="hud-mode">LIVE</span><span class="hud-title" id="hud-title"></span><span class="hud-source" id="hud-source" hidden></span></div>
                    <div class="hud-tr">
                        <span class="dev-only" id="hud-fps">– fps</span><span class="dev-only" id="hud-res"></span>
                        <span class="hud-chip simple-only" id="hud-smooth" hidden>Smooth preview · videos still render in full quality</span>
                    </div>
                    <div class="hud-cam" id="hud-cam"></div>
                    <div class="hud-br dev-only" id="hud-count"></div>
                </div>
                <div class="capture-bar" id="capture-bar" hidden></div>
                <div class="toast" id="toast" role="status" hidden></div>
                <div class="empty" id="empty"></div>
                <div class="viewport-msg" id="viewport-msg" hidden></div>
            </div>
            <div id="timeline-slot"></div>
        </section>

        <aside class="panel panel-right" id="right" aria-label="Controls"></aside>
    </main>

    <script type="module" src="/src/shell/studio/main.ts"></script>
</body>
</html>
