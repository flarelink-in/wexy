# platform-service (W2; the creations platform design §3). Secrets come from the environment: Infisical in deploys,
# and locally the untracked .env that the local profile imports. Never publish this service's port: it trusts the
# gateway's internal token.
spring:
  application:
    name: platform-service
  # Its own schema in MariaDB (compose.platform.yaml): the same account the database was created with.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3316/wexy_platform}
    username: ${SPRING_DATASOURCE_USERNAME:wexy_platform}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # The database scheduler is as wide as this pool (DatabaseScheduler). Two vCPUs and one MariaDB: a few
      # connections are plenty, and every one held is memory on the host.
      maximum-pool-size: 4
      minimum-idle: 1
      # Proposed bounds (§11): a connection in 2 s or none, so a lost database answers 503 quickly.
      connection-timeout: 2000
      validation-timeout: 1000
      max-lifetime: 600000
  jdbc:
    template:
      query-timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  # A world's save, from W3, is the largest body (§11's 768 KiB envelope); the gateway caps every other route at 256 KiB.
  codec:
    max-in-memory-size: 768KB

server:
  port: 8430

wexy:
  internal-jwt:
    # The gateway's published key set (InternalToken.JWKS_PATH).
    jwks-uri: ${WEXY_GATEWAY_URL:http://localhost:8400}/.well-known/jwks.json
  # Calls waiting for the database past the pool: more is refused at once, as 503 (DatabaseScheduler).
  database:
    queued-calls: 64
  account:
    # 32 random bytes as 64 hex characters, from Infisical: platform's own, never forge's uid key. Never rotated on
    # deploy: a new key makes every account unreachable (a rotation is a version and a migration). The prod profile
    # refuses to start without it.
    hmac-hex: ${WEXY_ACCOUNT_HMAC_KEY:}
    hmac-version: 1
    key-required: false
    policy-version: 1
  # W3: the private bucket for saved worlds (StorageProperties), under the names the user put in Infisical
  # (2026-11-03). Without any of the five the world routes answer 503 and accounts keep working.
  storage:
    threads: 4
    queued-calls: 32
    b2:
      endpoint: ${B2_ENDPOINT:}
      region: ${B2_REGION:}
      # Taken to be the private bucket's name (to confirm): never the public assets bucket.
      bucket: ${B2_BUCKET_KEY:}
      access-key: ${B2_ACCESS_KEY:}
      secret-key: ${B2_SECRET_KEY:}
      attempt-timeout: 5s
      call-timeout: 15s
  # W3's bounds (the creations platform design §11; WorldProperties): proposals for qualification.
  worlds:
    max-worlds: 50
    max-bytes: 104857600
    environment-bytes: 1073741824
    pending-saves: 2
    operation-life: 24h
    stale-after: 2m
    cleanup-every: 15s
    cleanup-batch: 10
    cleanup-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: platform-service
