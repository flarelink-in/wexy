# forge-service in production (docs/deploy-design.md, 2026-10-28). It is never published: only the gateway reaches
# it, on the compose network. Redis by its compose name; the actuator on a port of its own; the schemas strict, as
# the user's live runs of 2026-10-28 were. The key comes from Infisical through compose.prod.yaml
# (WEXY_META_API_KEY); an empty value starts the service paused, which the studio shows as the archive (B4's
# mode), never as a crash. The spend ceilings stay application.yaml's until the beta sets its own (Q9, Q50): raise
# one with an environment variable and a restart, e.g. WEXY_SPEND_GLOBAL_DAILYMICROUSD=25000000. The mock profile
# must never be active here: compose sets SPRING_PROFILES_ACTIVE=prod alone.
spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

management:
  server:
    port: 8411

wexy:
  internal-jwt:
    jwks-uri: ${WEXY_GATEWAY_URL:http://forge-gateway:8400}/.well-known/jwks.json
  loop:
    strict-schemas: true
