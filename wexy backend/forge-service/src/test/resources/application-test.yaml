# Hermetic: no Redis (port 1 refuses at once, so the meter fails closed), no key, no gateway.
spring:
  data:
    redis:
      port: 1

wexy:
  internal-jwt:
    jwks-uri: http://127.0.0.1:1/.well-known/jwks.json
  meta-api:
    base-url: http://127.0.0.1:1/v1
    api-key: ""
  allowance:
    # A test key, not a secret (W1): the allowances count callers as a deployment does; Redis refuses, so they deny.
    uid-hmac-hex: 7465737474657374746573747465737474657374746573747465737474657374
