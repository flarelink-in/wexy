# Hermetic: no Firebase, no App Check, no Redis (port 1 refuses at once, so every limiter falls back
# to its local bucket), and nothing behind the gateway unless a test starts it.
spring:
  data:
    redis:
      port: 1

wexy:
  forge-service:
    url: http://127.0.0.1:1
  # Another refusing port, so a test can tell which service a route leads to by its address alone (W2).
  platform-service:
    url: http://127.0.0.1:2
  firebase:
    required: false
  cors:
    allowed-origins: http://localhost:5173
  appcheck:
    enabled: false
  shield:
    edge:
      burst-capacity: 500
    ban:
      enabled: false
    buckets:
      # Raised above the compiled default (2 a second), so a test can tell configuration from code. Was forge-edit until
      # EA9.6 retired it; public-read, which EA9.6 chose, would have been lowered (15 and 45) under every public route.
      review-read:
        refill-per-second: 5
        burst-capacity: 30
