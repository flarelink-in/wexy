# Local development: the dev token verifier for sign-in while there are no Firebase credentials
# (DevTokenVerifier, forge-loop design §9), the Vite dev server's origins, and limits loose enough
# that poking by hand, or a smoke run, never trips a ban or a 429 from your own gateway.
spring:
  config:
    # The repository's untracked .env, whether the gateway starts from the root or its module
    # folder. Only this profile reads it, so tests never pick up a real secret.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

wexy:
  firebase:
    required: false
  network-key:
    # Not a secret: the ASCII of "local-dev-not-a-secret-iphmac-k1", so the local stack counts anonymous callers by
    # their network as a deployment does (W1). The local profile never runs anywhere else; .env may set a real one.
    hmac-hex: ${WEXY_IP_HMAC_KEY:6c6f63616c2d6465762d6e6f742d612d7365637265742d6970686d61632d6b31}
  auth:
    # W1: the local operator, a dev uid on the admin list (twenty worlds a day, the admin lane), which the frontend's
    # loop drive signs in as (dev.google.<uid>), so its several ideas a run are not refused as one anonymous caller's.
    # Dev tokens exist under this profile alone, so it admits no one anywhere else; WEXY_ADMIN_UIDS replaces it.
    admin-uids: ${WEXY_ADMIN_UIDS:00000000000000000000000000000001}
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  appcheck:
    enabled: false
  shield:
    edge:
      refill-per-second: 100
      burst-capacity: 500
    ban:
      enabled: false
    # Development is never rate limited by its own gateway (forge-loop design §9): a drive makes
    # several worlds in a row, and the compiled defaults answer 429 to a second run. Everything here
    # comes from one address, so the address-keyed buckets are raised too.
    buckets:
      agent-turn: { refill-per-second: 30, burst-capacity: 600, request-cost: 6 }
      agent-turn-user: { refill-per-second: 30, burst-capacity: 600, request-cost: 6 }
      agent-turn-anonymous: { refill-per-second: 30, burst-capacity: 600, request-cost: 6 }
      agent-module: { refill-per-second: 30, burst-capacity: 600 }
      agent-module-user: { refill-per-second: 30, burst-capacity: 600 }
      agent-module-anonymous: { refill-per-second: 30, burst-capacity: 600 }
      # EA6.4: a model's review and its terms; a drive reviews often.
      agent-review: { refill-per-second: 30, burst-capacity: 300 }
      agent-review-user: { refill-per-second: 30, burst-capacity: 300 }
      agent-review-anonymous: { refill-per-second: 30, burst-capacity: 300 }
      review-read: { refill-per-second: 30, burst-capacity: 300 }
      review-read-user: { refill-per-second: 30, burst-capacity: 300 }
      # W1: the allowance read after each Create and sign-in; a drive reads it often.
      account-read: { refill-per-second: 30, burst-capacity: 300 }
      account-read-user: { refill-per-second: 30, burst-capacity: 300 }
      # W2: the account's bootstrap and profile writes; a drive signs in and claims handles in a row.
      account-bootstrap: { refill-per-second: 30, burst-capacity: 300 }
      account-bootstrap-user: { refill-per-second: 30, burst-capacity: 300 }
      profile-write: { refill-per-second: 30, burst-capacity: 300 }
      profile-write-user: { refill-per-second: 30, burst-capacity: 300 }
